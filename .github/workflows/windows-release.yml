name: Windows Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-publish/**'

permissions:
  contents: write

jobs:
  create-tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and create release tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_BRANCH="release-publish/v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]; then
            echo "Expected branch ${EXPECTED_BRANCH}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to overwrite." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "NAS Archive ${TAG}"
          git push origin "${TAG}"

  release-windows:
    if: github.ref_type == 'tag'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax verification
        shell: pwsh
        run: |
          Get-ChildItem -Path electron -Filter *.js -Recurse | ForEach-Object {
            node --check $_.FullName
          }

      - name: Run JavaScript regression tests
        run: npm test

      - name: Build and publish Windows release
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced."
          }
          if ($installer.Length -le 0) {
            throw "Windows installer is empty."
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
