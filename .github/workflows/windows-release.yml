name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax verification
        shell: pwsh
        run: |
          Get-ChildItem -Path electron -Filter *.js -Recurse | ForEach-Object {
            node --check $_.FullName
          }

      - name: Run JavaScript regression tests
        run: npm test

      - name: Build and publish Windows release
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced."
          }
          if ($installer.Length -le 0) {
            throw "Windows installer is empty."
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
