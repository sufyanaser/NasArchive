name: Native Desktop CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax verification
        shell: pwsh
        run: |
          Get-ChildItem -Path electron,src,tests -Filter *.js -Recurse | ForEach-Object {
            node --check $_.FullName
          }

      - name: Run JavaScript regression tests
        run: npm test

      - name: Build unpacked Windows application
        run: npm run build
